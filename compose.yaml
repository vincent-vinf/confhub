x-app: &app
  build: .
  image: confhub:dev
  restart: unless-stopped
  cpus: ${CONFHUB_APP_CPUS:-1.0}
  mem_limit: ${CONFHUB_APP_MEMORY:-1g}
  memswap_limit: ${CONFHUB_APP_MEMORY:-1g}
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  env_file:
    - .env
  environment: &app-env
    GOMEMLIMIT: ${CONFHUB_APP_GO_MEMORY:-768MiB}
    CONFHUB_DATABASE: postgres
    CONFHUB_DSN: postgres://confhub:${CONFHUB_DB_PASSWORD:?set CONFHUB_DB_PASSWORD in .env}@db:5432/confhub?sslmode=disable
    CONFHUB_ADMIN_PASSWORD: ${CONFHUB_ADMIN_PASSWORD:?set CONFHUB_ADMIN_PASSWORD in .env}
    CONFHUB_JWT_SECRET: ${CONFHUB_JWT_SECRET:?set CONFHUB_JWT_SECRET in .env}
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
    interval: 5s
    timeout: 2s
    retries: 3
    start_period: 20s
services:
  db:
    image: registry.cn-hangzhou.aliyuncs.com/bodesi/postgres:17
    cpus: ${CONFHUB_DB_CPUS:-1.0}
    mem_limit: ${CONFHUB_DB_MEMORY:-2g}
    memswap_limit: ${CONFHUB_DB_MEMORY:-2g}
    environment:
      POSTGRES_DB: confhub
      POSTGRES_USER: confhub
      POSTGRES_PASSWORD: ${CONFHUB_DB_PASSWORD:?set CONFHUB_DB_PASSWORD in .env}
    volumes: ["./data/postgres:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confhub -d confhub"]
      interval: 2s
      timeout: 2s
      retries: 30
  app:
    <<: *app
    ports: ["${CONFHUB_PORT:-8080}:8080"]
  app2:
    <<: *app
    profiles: [ha]
    ports: ["${CONFHUB_PORT2:-8081}:8080"]
  app3:
    <<: *app
    profiles: [ha]
    ports: ["${CONFHUB_PORT3:-8082}:8080"]
